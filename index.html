  :root{
    --dark:#2b2350; --violet:#7c4dff; --pink:#ff4f9a; --yellow:#ffd23f; --teal:#22b8aa; --blue:#3f95ff;
    --orange:#ff9338; --green:#2fcf86; --cream:#fff6e6; --ink:#2b2350; --soft:#6d6896;
    --display:'Fredoka','Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink);overflow:hidden;
    background-color:var(--cream);
    background-image:radial-gradient(#ffd9a0 1.6px, transparent 1.7px);background-size:22px 22px;
  }
  button{font-family:inherit;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  /* ---------- header ---------- */
  header{
    flex-shrink:0;border-bottom:4px solid var(--dark);
    padding:8px 12px 12px;padding-top:calc(8px + env(safe-area-inset-top));
    background:
      radial-gradient(circle at 92% 18%, rgba(255,210,63,.75) 0 34px, transparent 35px),
      radial-gradient(circle at 70% 120%, rgba(63,149,255,.6) 0 46px, transparent 47px),
      radial-gradient(circle at 4% 110%, rgba(34,184,170,.6) 0 50px, transparent 51px),
      linear-gradient(135deg,#7c4dff,#ff4f9a);
  }
  .head-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .title{font-family:var(--display);font-weight:700;font-size:25px;color:#fff;text-shadow:0 3px 0 var(--dark);letter-spacing:.3px;}
  .save{
    font-size:12px;font-weight:800;color:#fff;display:flex;align-items:center;gap:6px;
    background:rgba(43,35,80,.35);padding:4px 10px;border-radius:20px;
  }
  .save-dot{width:9px;height:9px;border-radius:50%;background:#7dffb0;border:2px solid #fff;}
  .save-dot.saving{background:var(--yellow);}
  .class-row{display:flex;gap:10px;margin-top:8px;}
  #classSelect{
    flex:1;min-width:0;font-family:var(--display);font-size:19px;font-weight:600;color:var(--dark);
    padding:6px 12px;border-radius:16px;border:3px solid var(--dark);background:#fff;min-height:48px;
    box-shadow:0 4px 0 var(--dark);
  }
  .icon-btn{
    width:48px;min-height:48px;border-radius:16px;border:3px solid var(--dark);
    background:linear-gradient(180deg,#ffe27a,#ffc928);color:var(--dark);font-size:26px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 0 var(--dark);
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dark);}

  /* ---------- layout ---------- */
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .view{display:none;}
  .view.active{display:block;}
  .pad{padding:12px;max-width:760px;margin:0 auto;}
  nav#tabbar{
    flex-shrink:0;display:flex;background:#fff;border-top:4px solid var(--dark);
    padding:4px 6px;padding-bottom:calc(4px + env(safe-area-inset-bottom));gap:6px;
  }
  .tab{
    flex:1;background:none;border:none;color:#8b86b3;font-family:var(--display);font-weight:600;font-size:12.5px;
    padding:2px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;
  }
  .tab .ic{font-size:23px;line-height:1.2;padding:1px 20px;border-radius:16px;border:3px solid transparent;}
  .tab.active{color:var(--dark);}
  .tab.active .ic{border-color:var(--dark);box-shadow:0 3px 0 var(--dark);}
  .tab[data-view=plan].active .ic{background:#ffd23f;}
  .tab[data-view=students].active .ic{background:#ff8fc2;}
  .tab[data-view=settings].active .ic{background:#8ec5ff;}

  /* ---------- buttons / controls ---------- */
  .btn{
    font-family:var(--display);font-weight:600;font-size:15px;color:var(--dark);background:#fff;
    border:3px solid var(--dark);border-radius:14px;padding:9px 16px;min-height:46px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 4px 0 var(--dark);transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dark);}
  .btn-apple{background:linear-gradient(180deg,#ff82bd,#ff4f9a);color:#fff;text-shadow:0 1px 0 rgba(43,35,80,.45);}
  .btn-wood{background:linear-gradient(180deg,#ffe27a,#ffc928);}
  .btn-teal{background:linear-gradient(180deg,#62e3d7,#22b8aa);color:#fff;text-shadow:0 1px 0 rgba(43,35,80,.45);}
  .btn-blue{background:linear-gradient(180deg,#8ec5ff,#3f95ff);color:#fff;text-shadow:0 1px 0 rgba(43,35,80,.45);}
  .btn-outline{background:#fff;}
  .btn-danger{background:#fff;color:#e0245e;border-color:#e0245e;box-shadow:0 4px 0 #e0245e;}
  .btn-danger:active{box-shadow:0 1px 0 #e0245e;}
  .btn-block{display:flex;width:100%;margin-top:12px;}
  .btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn-row .btn{flex:1;padding-left:8px;padding-right:8px;}
  .seg{display:inline-flex;border:3px solid var(--dark);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 3px 0 var(--dark);}
  .seg button{
    border:none;background:transparent;padding:6px 12px;font-family:var(--display);font-weight:600;font-size:14px;
    color:var(--soft);cursor:pointer;min-height:40px;
  }
  .seg button + button{border-left:3px solid var(--dark);}
  .seg button.on{background:var(--violet);color:#fff;}
  .stepper{display:inline-flex;align-items:center;border:3px solid var(--dark);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 3px 0 var(--dark);}
  .stepper button{width:46px;height:40px;border:none;background:#ffe27a;font-size:22px;font-weight:700;color:var(--dark);cursor:pointer;font-family:var(--display);}
  .stepper button:active{background:#ffc928;}
  .stepper .val{min-width:40px;text-align:center;font-family:var(--display);font-weight:700;font-size:17px;}
  .txt{
    width:100%;font-family:inherit;font-size:16px;font-weight:700;padding:11px 12px;border:3px solid var(--dark);
    border-radius:14px;background:#fff;color:var(--dark);
  }
  .txt:focus{outline:none;box-shadow:0 0 0 4px rgba(124,77,255,.35);}
  textarea.txt{resize:vertical;min-height:140px;}
  .offscreen{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}

  /* ---------- photos ---------- */
  .ph{
    width:46px;height:46px;border-radius:12px;border:3px solid var(--dark);overflow:hidden;background:#ffe27a;
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--dark);flex-shrink:0;
  }
  .ph.lg{width:56px;height:56px;font-size:18px;}
  .ph.xl{width:96px;height:96px;font-size:36px;border-radius:18px;}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ---------- plan ---------- */
  .plan-wrap{max-width:760px;margin:0 auto;padding:12px 10px;}
  .plan-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .count{
    font-family:var(--display);font-weight:600;font-size:15px;background:#fff;border:3px solid var(--dark);
    border-radius:20px;padding:5px 14px;box-shadow:0 3px 0 var(--dark);
  }
  .plan-actions{display:flex;gap:10px;margin-bottom:22px;}
  .plan-actions .btn{flex:1;padding:8px 6px;}
  .plan-grid{display:flex;gap:10px;align-items:stretch;}
  .col{flex:1;min-width:0;display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:24px;}
  .tbl{position:relative;width:100%;max-width:300px;margin:0 auto;}
  .tbl.single{max-width:130px;}
  .bar{
    position:relative;display:grid;gap:5px;padding:20px 6px 7px;
    border:3px solid var(--dark);border-radius:16px;box-shadow:0 5px 0 var(--dark);
  }
  .tbl.round .bar{border-radius:28px;}
  .hub{
    border:3px solid var(--dark);border-radius:50%;background:#fff;color:var(--dark);font-family:var(--display);font-weight:700;font-size:15px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 3px 0 var(--dark);
  }
  .hub:active{transform:translateY(2px);box-shadow:0 1px 0 var(--dark);}
  .hub.badge{position:absolute;top:-17px;left:50%;margin-left:-17px;width:34px;height:34px;z-index:3;}
  .hub.center{position:absolute;left:50%;top:50%;margin:0;transform:translate(-50%,-50%);width:16%;height:16%;min-width:32px;min-height:32px;z-index:3;}
  .hub.center:active{transform:translate(-50%,-47%);}
  .seat{
    position:relative;display:flex;flex-direction:column;gap:2px;padding:3px;margin:0;
    border:3px solid var(--dark);border-radius:12px;background:#fff;color:var(--dark);cursor:pointer;min-width:0;
    box-shadow:0 2px 0 rgba(43,35,80,.45);
  }
  .seat:active{transform:scale(.96);}
  .seat.empty{background:rgba(255,255,255,.38);border:3px dashed rgba(255,255,255,.95);box-shadow:none;}
  .sp{position:relative;width:100%;padding-top:100%;border-radius:8px;overflow:hidden;background:#ffe27a;}
  .seat.empty .sp{background:transparent;}
  .sp img,.sp .ini,.sp .plus{position:absolute;left:0;top:0;width:100%;height:100%;}
  .sp img{object-fit:cover;display:block;}
  .ini,.plus{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;color:var(--dark);}
  .plus{color:#fff;font-size:26px;text-shadow:0 2px 0 rgba(43,35,80,.35);}
  .sn{
    width:100%;font-size:clamp(8px,2.3vw,10px);letter-spacing:-.2px;font-weight:800;line-height:1.1;text-align:center;min-height:2.2em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:normal;overflow-wrap:normal;
  }
  /* ring (camembert) mode */
  .disc-wrap{position:relative;width:100%;padding-top:100%;}
  .disc{position:absolute;left:14%;top:14%;right:14%;bottom:14%;border-radius:50%;border:3px solid var(--dark);box-shadow:0 5px 0 var(--dark);}
  .ring .seat{position:absolute;transform:translate(-50%,-50%);z-index:2;}
  .ring .seat:active{transform:translate(-50%,-50%) scale(.96);}
  .board{
    margin:26px auto 8px;width:72%;max-width:420px;height:60px;
    background:linear-gradient(180deg,#34d399,#1ca57a);border:4px solid var(--dark);border-radius:16px;
    box-shadow:0 5px 0 var(--dark), inset 0 0 0 4px rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;
  }
  .board span{font-family:var(--display);font-weight:600;color:#fff;font-size:19px;letter-spacing:4px;text-shadow:0 2px 0 rgba(43,35,80,.45);}
  .hint{font-size:12px;font-weight:700;color:var(--soft);text-align:center;margin:12px 6px 6px;}
  .empty-state{
    text-align:center;padding:24px 14px;color:var(--soft);font-weight:800;background:#fff;border:3px dashed var(--violet);
    border-radius:20px;margin-bottom:12px;
  }
  .empty-state .btn{margin-top:14px;}

  /* ---------- lists / cards ---------- */
  .row{
    display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;margin-bottom:10px;text-align:left;
    background:#fff;border:3px solid var(--dark);border-radius:16px;cursor:pointer;color:var(--dark);font-size:15px;
    box-shadow:0 3px 0 var(--dark);
  }
  .row:active{transform:translateY(2px);box-shadow:0 1px 0 var(--dark);}
  .row .rname{flex:1;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .tag{font-family:var(--display);font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:14px;background:#e4dbff;color:#4b2fb5;white-space:nowrap;}
  .tag.warn{background:#ffd6e8;color:#c21868;}
  .stu-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .stu-actions{display:flex;gap:10px;}
  .card{background:#fff;border:3px solid var(--dark);border-radius:20px;padding:12px;margin:14px 12px;box-shadow:0 5px 0 var(--dark);}
  .card h3{
    font-family:var(--display);font-weight:700;font-size:18px;margin:-12px -12px 12px;padding:10px 14px;
    border-bottom:3px solid var(--dark);border-radius:17px 17px 0 0;background:#ffe27a;
  }
  .card:nth-child(2) h3{background:#ffb3d6;}
  .card:nth-child(3) h3{background:#a9d4ff;}
  .card:nth-child(4) h3{background:#a6efc9;}
  .card:nth-child(5) h3{background:#d3c4ff;}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-weight:800;font-size:14px;}
  .note{font-size:12px;font-weight:700;color:var(--soft);margin:8px 0 0;line-height:1.4;}
  .sep{border:none;border-top:3px dashed #d9d2f5;margin:14px 0;}
  .lbl{font-family:var(--display);font-size:13px;font-weight:600;color:var(--violet);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 7px;}

  /* ---------- sheet ---------- */
  #sheetBg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(43,35,80,.6);display:none;align-items:flex-end;justify-content:center;z-index:100;}
  #sheetBg.open{display:flex;}
  #sheet{
    background:#fff;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;border-radius:26px 26px 0 0;
    border:4px solid var(--dark);border-bottom:none;
    display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;border-bottom:3px solid var(--dark);flex-shrink:0;
    background:linear-gradient(135deg,#ffe27a,#ffb3d6);border-radius:22px 22px 0 0;
  }
  .sheet-title{font-family:var(--display);font-weight:700;font-size:21px;}
  .sheet-close{
    border:3px solid var(--dark);background:#ff4f9a;color:#fff;border-radius:50%;width:38px;height:38px;font-size:16px;font-weight:800;
    cursor:pointer;box-shadow:0 3px 0 var(--dark);
  }
  .sheet-close:active{transform:translateY(2px);box-shadow:0 1px 0 var(--dark);}
  #sheetBody{overflow-y:auto;padding:12px 16px 18px;-webkit-overflow-scrolling:touch;}
  .sheet-msg{font-size:15px;font-weight:700;line-height:1.45;margin:0 0 4px;}
  .sheet-ok{min-height:20px;font-family:var(--display);font-size:14px;font-weight:600;color:#14946a;margin-top:8px;}
  .list-head{font-family:var(--display);font-size:13px;font-weight:600;color:var(--violet);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 8px;}
  .cur{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .cur-name{font-family:var(--display);font-weight:700;font-size:20px;}
  .photo-line{display:flex;align-items:center;gap:14px;margin:14px 0;}
  .photo-line .btn{min-height:42px;}
  .num-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .num-grid .btn{min-width:50px;flex:none;}

  @media (min-width:700px){
    .sn{font-size:11px;}
  }
  @media print{
    header,nav,.plan-top,.plan-actions,.hint,.hub{display:none !important;}
    #viewStudents,#viewSettings{display:none !important;}
    body,#app,main{overflow:visible;height:auto;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="head-row">
      <div class="title">📚 Plan de Classe</div>
      <div class="save"><span class="save-dot" id="saveDot"></span><span id="saveText">Enregistré</span></div>
    </div>
    <div class="class-row">
      <select id="classSelect" aria-label="Classe"></select>
      <button type="button" class="icon-btn" id="newClassBtn" aria-label="Nouvelle classe">＋</button>
    </div>
  </header>

  <main id="main">
    <section id="viewPlan" class="view active">
      <div class="plan-wrap">
        <div class="plan-top">
          <div class="count" id="planCount"></div>
          <div class="seg" id="modeSeg"></div>
        </div>
        <div class="plan-actions" id="planActions"></div>
        <div id="planEmpty" class="empty-state" style="display:none;">
          Aucune table pour l'instant.<br>
          <button type="button" class="btn btn-apple" id="quickEmptyBtn">🎯 Disposer 6 tables camembert</button>
        </div>
        <div class="plan-grid" id="planGrid"></div>
        <div class="board"><span>TABLEAU</span></div>
        <p class="hint">Touchez une place pour y mettre un élève · touchez le numéro d'une table pour la modifier.</p>
      </div>
    </section>
    <section id="viewStudents" class="view"><div class="pad" id="studentsWrap"></div></section>
    <section id="viewSettings" class="view"><div class="pad" id="settingsWrap" style="padding:0;"></div></section>
  </main>

  <nav id="tabbar">
    <button type="button" class="tab active" data-view="plan"><span class="ic">🪑</span><span>Plan</span></button>
    <button type="button" class="tab" data-view="students"><span class="ic">🧑‍🎓</span><span id="tabStudentsLabel">Élèves</span></button>
    <button type="button" class="tab" data-view="settings"><span class="ic">⚙️</span><span>Réglages</span></button>
  </nav>
</div>

<div id="sheetBg">
  <div id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle"></div>
      <button type="button" class="sheet-close" id="sheetClose" aria-label="Fermer">✕</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" class="offscreen">
<input type="file" id="importInput" accept="application/json,.json" class="offscreen">

<script>
(function(){
  "use strict";

  var KEY = "planDeClasseData_v1";
  var state = null;
  var saveTimer = null;
  var dirty = false;
  var photoCb = null;
  var qlCount = 6;
  var qlShape = "round";
  var resizeTimer = null;

  /* ---------------- helpers ---------------- */
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function btn(label, cls, onClick){
    var b = el("button", cls || "", label);
    b.type = "button";
    if(onClick) b.addEventListener("click", onClick);
    return b;
  }
  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  var TCOL = [
    ["#ffa6d1","#ff5fa8"], ["#9ccbff","#3f95ff"], ["#8cecbd","#2fcf86"], ["#ffcf8a","#ff9338"],
    ["#cbb9ff","#8a67ff"], ["#ffe98a","#ffc928"], ["#8ae9df","#22b8aa"], ["#ffa9a9","#ff5f5f"]
  ];
  var PASTELS = ["#ffd1e8","#cfe6ff","#c8f5de","#ffe3c2","#e1d6ff","#fff0a8","#c4f1ec","#ffd0d0"];
  function pastel(name){
    var h = 0;
    for(var i=0;i<name.length;i++) h += name.charCodeAt(i);
    return PASTELS[h % PASTELS.length];
  }
  function initials(name){
    var parts = name.trim().split(/\s+/), s = "";
    for(var i=0;i<Math.min(2,parts.length);i++){ if(parts[i].length) s += parts[i].charAt(0).toUpperCase(); }
    return s || "?";
  }

  /* ---------------- data ---------------- */
  function seatsFor(shape, len){
    if(shape === "duo") return 2;
    if(shape === "single") return 1;
    return clamp(len || 5, 3, 8);
  }

  function normClass(c, id){
    var out = { id:id, name:String(c.name || "Classe"), columns:clamp(parseInt(c.columns,10) || 2, 1, 4), students:[], tables:[] };
    var ids = {};
    var src = c.students || [];
    var i, k;
    for(i=0;i<src.length;i++){
      var s = src[i];
      if(!s || !s.name) continue;
      var sid = (s.id && !ids[s.id]) ? s.id : uid("s");
      ids[sid] = true;
      out.students.push({ id:sid, name:String(s.name), photo:s.photo || null });
    }
    var used = {};
    var tsrc = c.tables || c.desks || [];
    for(i=0;i<tsrc.length;i++){
      var t = tsrc[i];
      if(!t) continue;
      var seatsIn = t.seats || [];
      var shape = t.shape;
      if(shape !== "round" && shape !== "duo" && shape !== "single"){
        shape = seatsIn.length >= 2 ? "duo" : "single";
      }
      var n = seatsFor(shape, seatsIn.length);
      var seats = [];
      for(k=0;k<n;k++){
        var v = seatsIn[k];
        if(v && ids[v] && !used[v]){ used[v] = true; seats.push(v); } else { seats.push(null); }
      }
      out.tables.push({ id:t.id || uid("t"), shape:shape, seats:seats });
    }
    return out;
  }

  function defaultState(){
    var c = { id:uid("c"), name:"Classe 1", columns:2, students:[], tables:[] };
    return { classes:[c], activeClassId:c.id, nameMode:"full", defaultSeats:5, viewMode:null };
  }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && p.classes && p.classes.length){
          var st = {
            classes:[], activeClassId:p.activeClassId,
            nameMode:(p.nameMode === "first" || p.nameMode === "last") ? p.nameMode : "full",
            defaultSeats:clamp(parseInt(p.defaultSeats,10) || 5, 3, 8),
            viewMode:(p.viewMode === "ring" || p.viewMode === "compact") ? p.viewMode : null
          };
          for(var i=0;i<p.classes.length;i++){
            st.classes.push(normClass(p.classes[i], p.classes[i].id || uid("c")));
          }
          var ok = false;
          for(var j=0;j<st.classes.length;j++){ if(st.classes[j].id === st.activeClassId) ok = true; }
          if(!ok) st.activeClassId = st.classes[0].id;
          return st;
        }
      }
    }catch(e){}
    return defaultState();
  }

  function flushSave(){
    if(!dirty) return;
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
      dirty = false;
      $("saveDot").className = "save-dot";
      $("saveText").textContent = "Enregistré";
    }catch(e){
      $("saveText").textContent = "Erreur de sauvegarde (stockage plein ?)";
    }
  }
  function persist(){
    dirty = true;
    $("saveDot").className = "save-dot saving";
    $("saveText").textContent = "Enregistrement…";
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 250);
  }
  function commit(){ persist(); renderAll(); }

  function curClass(){
    for(var i=0;i<state.classes.length;i++){
      if(state.classes[i].id === state.activeClassId) return state.classes[i];
    }
    return state.classes[0];
  }
  function findStudent(cls, id){
    for(var i=0;i<cls.students.length;i++){ if(cls.students[i].id === id) return cls.students[i]; }
    return null;
  }
  function seatOf(cls, studentId){
    for(var i=0;i<cls.tables.length;i++){
      var seats = cls.tables[i].seats;
      for(var j=0;j<seats.length;j++){ if(seats[j] === studentId) return { t:i, s:j }; }
    }
    return null;
  }
  function seatLabel(cls, studentId){
    var p = seatOf(cls, studentId);
    return p ? "Table " + (p.t + 1) : null;
  }
  function unseat(cls, studentId){
    for(var i=0;i<cls.tables.length;i++){
      var seats = cls.tables[i].seats;
      for(var j=0;j<seats.length;j++){ if(seats[j] === studentId) seats[j] = null; }
    }
  }
  function assign(cls, k, s, studentId){
    var t = cls.tables[k];
    var occupant = t.seats[s];
    if(occupant === studentId) return;
    var from = seatOf(cls, studentId);
    if(from) cls.tables[from.t].seats[from.s] = occupant || null;
    t.seats[s] = studentId;
  }
  function sortedStudents(cls){
    var a = cls.students.slice();
    a.sort(function(x,y){ return x.name.localeCompare(y.name, "fr", { sensitivity:"base" }); });
    return a;
  }
  function dispName(s){
    var m = state.nameMode;
    if(m === "full") return s.name;
    var p = s.name.trim().split(/\s+/);
    return m === "first" ? p[0] : p[p.length-1];
  }
  function getViewMode(){
    return state.viewMode || (window.innerWidth < 700 ? "compact" : "ring");
  }
  function newTable(shape, seatCount){
    var n = seatsFor(shape, seatCount);
    var seats = [];
    for(var i=0;i<n;i++) seats.push(null);
    return { id:uid("t"), shape:shape, seats:seats };
  }
  function applyQuick(cls, count, shape, columns){
    var old = cls.tables, nt = [];
    for(var i=0;i<count;i++){
      var t = newTable(shape, state.defaultSeats);
      if(old[i]){ for(var s=0;s<t.seats.length;s++) t.seats[s] = old[i].seats[s] || null; }
      nt.push(t);
    }
    cls.tables = nt;
    if(columns) cls.columns = columns;
  }

  /* ---------------- sheet (modales maison) ---------------- */
  var sheetBuilder = null;
  function openSheet(title, builder){
    $("sheetTitle").textContent = title;
    sheetBuilder = builder;
    var body = $("sheetBody");
    body.innerHTML = "";
    builder(body);
    $("sheetBg").className = "open";
    body.scrollTop = 0;
  }
  function refreshSheet(){
    if(!sheetBuilder) return;
    var body = $("sheetBody"), st = body.scrollTop;
    body.innerHTML = "";
    sheetBuilder(body);
    body.scrollTop = st;
  }
  function closeSheet(){
    $("sheetBg").className = "";
    sheetBuilder = null;
    $("sheetBody").innerHTML = "";
  }
  function infoSheet(title, msg){
    openSheet(title, function(body){
      body.appendChild(el("p", "sheet-msg", msg));
      body.appendChild(btn("OK", "btn btn-apple btn-block", closeSheet));
    });
  }
  function confirmSheet(title, msg, okLabel, onOk, danger){
    openSheet(title, function(body){
      body.appendChild(el("p", "sheet-msg", msg));
      var row = el("div", "btn-row");
      row.appendChild(btn("Annuler", "btn btn-outline", closeSheet));
      row.appendChild(btn(okLabel, "btn " + (danger ? "btn-danger" : "btn-apple"), function(){ closeSheet(); onOk(); }));
      body.appendChild(row);
    });
  }
  function inputSheet(title, value, okLabel, onOk){
    openSheet(title, function(body){
      var inp = el("input", "txt");
      inp.type = "text";
      inp.value = value || "";
      body.appendChild(inp);
      function go(){
        var v = inp.value.trim();
        if(!v){ inp.focus(); return; }
        closeSheet();
        onOk(v);
      }
      inp.addEventListener("keydown", function(ev){ if(ev.key === "Enter") go(); });
      var row = el("div", "btn-row");
      row.appendChild(btn("Annuler", "btn btn-outline", closeSheet));
      row.appendChild(btn(okLabel, "btn btn-apple", go));
      body.appendChild(row);
      setTimeout(function(){ inp.focus(); inp.select(); }, 60);
    });
  }

  /* ---------------- widgets ---------------- */
  function photoBox(student, size){
    var d = el("div", "ph" + (size ? " " + size : ""));
    if(student && student.photo){
      var im = el("img");

  function ringGeom(n, W){
    var R = W * 0.31, best = 24;
    for(var w = Math.floor(W * 0.30); w >= 24; w--){
      var h = w + 22, ok = true, i;
      for(i=0;i<n;i++){
        var a1 = ((i + 0.5) * 360 / n - 90) * Math.PI / 180;
        var a2 = ((i + 1.5) * 360 / n - 90) * Math.PI / 180;
        var dx = Math.abs(R*Math.cos(a1) - R*Math.cos(a2));
        var dy = Math.abs(R*Math.sin(a1) - R*Math.sin(a2));
        if(dx < w + 2 && dy < h + 2){ ok = false; break; }
        if(Math.abs(R*Math.cos(a1)) + w/2 > W/2 - 1 || Math.abs(R*Math.sin(a1)) + h/2 > W/2 - 1){ ok = false; break; }
      }
      if(ok){ best = w; break; }
    }
    return { w:best, R:R };
  }

  function gridCols(n){
    if(n <= 3) return n;
    if(n === 4) return 2;
    if(n <= 6) return 3;
    return 4;
  }

  function buildTable(cls, k, ring, W){
    var t = cls.tables[k];
    var n = t.seats.length;
    var box = el("div", "tbl " + t.shape);
    var hub = btn(String(k+1), "hub", function(){ openTableSheet(k); });
    hub.setAttribute("aria-label", "Options de la table " + (k+1));
    var i;
    if(t.shape === "round" && ring){
      box.className += " ring";
      var wrap = el("div", "disc-wrap");
      var disc = el("div", "disc");
      var slice = 360 / n;
      var tc = TCOL[k % TCOL.length];
      disc.style.background =
        "repeating-conic-gradient(from 0deg, rgba(43,35,80,0.55) 0deg 1.4deg, transparent 1.4deg " + slice + "deg), " +
        "radial-gradient(circle, " + tc[0] + " 0%, " + tc[1] + " 100%)";
      wrap.appendChild(disc);
      var g = ringGeom(n, W);
      var wPct = g.w / W * 100;
      for(i=0;i<n;i++){
        var ang = ((i + 0.5) * slice - 90) * Math.PI / 180;
        var seat = buildSeat(cls, k, i);
        seat.style.width = wPct + "%";
        seat.style.left = (50 + (g.R / W) * 100 * Math.cos(ang)) + "%";
        seat.style.top = (50 + (g.R / W) * 100 * Math.sin(ang)) + "%";
        wrap.appendChild(seat);
      }
      hub.className += " center";
      wrap.appendChild(hub);
      box.appendChild(wrap);
    } else {
      var bar = el("div", "bar");
      var bc = TCOL[k % TCOL.length];
      bar.style.background = "linear-gradient(180deg," + bc[0] + "," + bc[1] + ")";
      var cols = (t.shape === "round") ? gridCols(n) : n;
      bar.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
      for(i=0;i<n;i++) bar.appendChild(buildSeat(cls, k, i));
      hub.className += " badge";
      bar.appendChild(hub);
      box.appendChild(bar);
    }
    return box;
  }

    var pw = Math.min(760, window.innerWidth) - 20;
    var colW = Math.floor(Math.min(300, (pw - (usedCols - 1) * 8) / usedCols));
    var ring = (mode === "ring");
    for(var c=0;c<usedCols;c++){

  function openSeatPicker(k, s){

      if(!t){ closeSheet(); return; }
      var occId = t.seats[s];
      var occ = occId ? findStudent(cls, occId) : null;
      if(occ){
        var cur = el("div", "cur");
        cur.appendChild(photoBox(occ, "xl"));
        cur.appendChild(el("div", "cur-name", occ.name));
        body.appendChild(cur);
        body.appendChild(btn("Vider cette place", "btn btn-outline btn-block", function(){
          t.seats[s] = null;
          closeSheet();
          commit();
        }));
      }
      var sorted = sortedStudents(cls);
      if(!sorted.length){
        body.appendChild(el("p", "sheet-msg", "Aucun élève dans cette classe pour l'instant."));
        body.appendChild(btn("Ajouter des élèves", "btn btn-apple btn-block", function(){
          closeSheet();
          showView("students");
          openAddStudent();
        }));
        return;
      }
      var free = [], placed = [];
      sorted.forEach(function(st){
        if(st.id === occId) return;
        if(seatOf(cls, st.id)) placed.push(st); else free.push(st);
      });
      function addRows(list, withTag){
        list.forEach(function(st){
          body.appendChild(studentRow(st, withTag ? seatLabel(cls, st.id) : null, false, function(){
            assign(cls, k, s, st.id);
            closeSheet();
            commit();
          }));
        });
      }
      if(free.length){
        body.appendChild(el("div", "list-head", "Sans place (" + free.length + ")"));
        addRows(free, false);
      }
      if(placed.length){
        body.appendChild(el("div", "list-head", "Déjà placés — toucher pour échanger"));
        addRows(placed, true);
      }
    });
  }

  function randomFill(){
    var cls = curClass();
    var free = [], i, j;
    for(i=0;i<cls.students.length;i++){ if(!seatOf(cls, cls.students[i].id)) free.push(cls.students[i].id); }
    var empty = [];
    for(i=0;i<cls.tables.length;i++){
      for(j=0;j<cls.tables[i].seats.length;j++){ if(!cls.tables[i].seats[j]) empty.push({ t:i, s:j }); }
    }
    if(!cls.students.length){ infoSheet("Aucun élève", "Ajoutez d'abord des élèves dans l'onglet Élèves."); return; }
    if(!free.length){ infoSheet("Tout le monde est placé", "Tous les élèves ont déjà une place."); return; }
    if(!empty.length){ infoSheet("Plus de place", "Il n'y a aucune place libre : ajoutez des tables ou des places."); return; }
    shuffle(free); shuffle(empty);
    var n = Math.min(free.length, empty.length);
    for(i=0;i<n;i++) cls.tables[empty[i].t].seats[empty[i].s] = free[i];
    commit();
    if(free.length > empty.length){
      infoSheet("Placement terminé", (free.length - empty.length) + " élève(s) n'ont pas trouvé de place : ajoutez des places ou des tables.");
    }
  }

  function readPhoto(file, cb){
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var size = 128;
        var c = document.createElement("canvas");
        c.width = size; c.height = size;
        var ctx = c.getContext("2d");
        var side = Math.min(img.width, img.height);
        var sx = (img.width - side) / 2;
        var sy = (img.height - side) * 0.3;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        cb(c.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = function(){ cb(null); };
      img.src = ev.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

        photo = null;
        inp.value = "";
        msg.textContent = "✓ " + name + " ajouté";
        commit();
        refreshPhotoLine();
        inp.focus();
      }
      function refreshPhotoLine(){
        var old = body.querySelector(".photo-line");
        var nu = photoEditor(function(){ return photo; }, function(v){ photo = v; });
        body.replaceChild(nu, old);
      }
      inp.addEventListener("keydown", function(ev){ if(ev.key === "Enter") add(); });
      var row = el("div", "btn-row");
      row.appendChild(btn("Terminer", "btn btn-outline", closeSheet));
      row.appendChild(btn("＋ Ajouter", "btn btn-apple", add));
      body.appendChild(row);
      setTimeout(function(){ inp.focus(); }, 60);
    });
  }

  function openBulkAdd(){
    openSheet("Ajouter une liste d'élèves", function(body){
      var cls = curClass();
      body.appendChild(el("p", "sheet-msg", "Collez ou tapez un élève par ligne."));
      var ta = el("textarea", "txt");
      ta.placeholder = "DUPONT Marie\nMARTIN Lucas\n…";
      body.appendChild(ta);
      var row = el("div", "btn-row");
      row.appendChild(btn("Annuler", "btn btn-outline", closeSheet));
      row.appendChild(btn("Ajouter", "btn btn-apple", function(){
        var lines = ta.value.split(/\r?\n/);
        var n = 0;
        lines.forEach(function(l){
          var name = l.replace(/[\t;]+/g, " ").replace(/\s+/g, " ").trim();
          if(name){ cls.students.push({ id:uid("s"), name:name, photo:null }); n++; }
        });
        closeSheet();
        if(n) commit();
      }));
      body.appendChild(row);
      setTimeout(function(){ ta.focus(); }, 60);
    });
  }

  function openEditStudent(id){
    var cls = curClass();
    var st = findStudent(cls, id);
    if(!st) return;
    var photo = st.photo;
    openSheet(st.name, function(body){
      var inp = el("input", "txt");
      inp.type = "text";
      inp.value = st.name;
      body.appendChild(inp);
      body.appendChild(photoEditor(function(){ return photo; }, function(v){ photo = v; }));
      var lab = seatLabel(cls, st.id);
      body.appendChild(el("p", "note", lab ? "Place actuelle : " + lab + "." : "Cet élève n'a pas encore de place."));
      function save(){
        var name = inp.value.trim();
        if(!name){ inp.focus(); return; }
        st.name = name;
        st.photo = photo;
        closeSheet();
        commit();
      }
      inp.addEventListener("keydown", function(ev){ if(ev.key === "Enter") save(); });
      var row = el("div", "btn-row");
      row.appendChild(btn("Annuler", "btn btn-outline", closeSheet));
      row.appendChild(btn("Enregistrer", "btn btn-apple", save));
      body.appendChild(row);
      body.appendChild(btn("🗑 Retirer de la classe", "btn btn-danger btn-block", function(){
        confirmSheet("Retirer l'élève", "Retirer « " + st.name + " » de la classe ?", "Retirer", function(){
          unseat(cls, st.id);
          cls.students = cls.students.filter(function(x){ return x.id !== st.id; });
          commit();
        }, true);
      }));
    });
  }

  /* ---------------- classes ---------------- */
  function newClass(){
    inputSheet("Nouvelle classe", "", "Créer", function(name){
      var c = { id:uid("c"), name:name, columns:2, students:[], tables:[] };
      state.classes.push(c);
      state.activeClassId = c.id;
      commit();
      showView("plan");
    });
  }
  function duplicateClass(){
    var cls = curClass();
    inputSheet("Nom de la copie", cls.name + " (copie)", "Dupliquer", function(name){
      var map = {};
      var students = cls.students.map(function(s){
        var ns = { id:uid("s"), name:s.name, photo:s.photo };
        map[s.id] = ns.id;
        return ns;
      });
      var tables = cls.tables.map(function(t){
        return { id:uid("t"), shape:t.shape, seats:t.seats.map(function(sid){ return sid ? map[sid] : null; }) };
      });
      var c = { id:uid("c"), name:name, columns:cls.columns, students:students, tables:tables };
      state.classes.push(c);
      state.activeClassId = c.id;
      commit();
    });
  }
  function deleteClass(){
    var cls = curClass();
    if(state.classes.length <= 1){
      infoSheet("Impossible", "Impossible de supprimer la dernière classe.");
      return;
    }
    confirmSheet("Supprimer la classe", "Supprimer « " + cls.name + " » avec tous ses élèves et ses tables ?", "Supprimer", function(){
      state.classes = state.classes.filter(function(c){ return c.id !== cls.id; });
      state.activeClassId = state.classes[0].id;
      commit();
    }, true);
  }

  /* ---------------- export / import ---------------- */
  function download(filename, text){
    var blob = new Blob([text], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }

  /* ---------------- init / events ---------------- */
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetBg").addEventListener("click", function(ev){ if(ev.target === $("sheetBg")) closeSheet(); });
  $("newClassBtn").addEventListener("click", newClass);
  $("classSelect").addEventListener("change", function(){
    state.activeClassId = this.value;
    persist();
    renderAll();
  });
  $("quickEmptyBtn").addEventListener("click", function(){
    applyQuick(curClass(), 6, "round", 2);
    commit();
  });
  var tabs = document.querySelectorAll(".tab");
  for(var ti=0;ti<tabs.length;ti++){
    tabs[ti].addEventListener("click", function(){ showView(this.getAttribute("data-view")); });
  }
  $("photoInput").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if(!f || !photoCb) return;
    readPhoto(f, function(d){ if(photoCb) photoCb(d); });
  });
  $("importInput").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var data = JSON.parse(ev.target.result);
        var added = 0, last = null, i;
        if(data && data.classes && data.classes.length){
          for(i=0;i<data.classes.length;i++){
            last = normClass(data.classes[i], uid("c"));
            state.classes.push(last);
            added++;
          }
        } else if(data && data.students){
          last = normClass(data, uid("c"));
          state.classes.push(last);
          added = 1;
        }
        if(!added){ infoSheet("Fichier invalide", "Ce fichier ne contient aucune classe reconnue."); return; }
        state.activeClassId = last.id;
        commit();
        infoSheet("Import réussi", added + " classe" + (added > 1 ? "s" : "") + " importée" + (added > 1 ? "s" : "") + ".");
      }catch(e){
        infoSheet("Fichier illisible", "Impossible de lire ce fichier JSON.");
      }
    };
    reader.readAsText(f);
  });
  window.addEventListener("pagehide", flushSave);
  document.addEventListener("visibilitychange", function(){ if(document.hidden) flushSave(); });
  window.addEventListener("resize", function(){
    if(resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderPlan, 200);
  });

  state = load();
  renderAll();
  showView("plan");
  persist();
})();
</script>
</body>
</html>
